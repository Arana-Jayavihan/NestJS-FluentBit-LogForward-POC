# FluentBit Helm Chart values for POC deployment
# Install with: helm install fluent-bit fluent/fluent-bit -n monitoring -f fluentbit-values.yaml

# Run as deployment instead of daemonset for this POC
kind: Deployment
replicaCount: 1

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  tag: "3.2.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 2020
  annotations: {}

# Expose TCP input port for receiving logs from NestJS app
extraPorts:
  - port: 9000
    containerPort: 9000
    protocol: TCP
    name: tcp-input

# Mount the secrets ConfigMap
extraVolumes:
  - name: fluentbit-secrets
    configMap:
      name: fluentbit-secrets

extraVolumeMounts:
  - name: fluentbit-secrets
    mountPath: /fluent-bit/secrets
    readOnly: true

# FluentBit configuration
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tcp
        Listen 0.0.0.0
        Port 9000
        Chunk_Size 32
        Buffer_Size 64
        Format json
        Tag app.logs

  filters: |
    [FILTER]
        Name modify
        Match *
        Rename time CreatedTime

  outputs: |
    [OUTPUT]
        Name stdout
        Match *
        Format json_lines

    [OUTPUT]
        Name file
        Match *
        Path /tmp
        File out.log

    # Uncomment and configure for Azure Log Analytics
    # Secrets are loaded from ConfigMap mounted at /fluent-bit/secrets
    # [OUTPUT]
    #     Name azure_logs_ingestion
    #     Match *
    #     client_id ${AZURE_CLIENT_ID}
    #     client_secret ${AZURE_CLIENT_SECRET}
    #     tenant_id ${AZURE_TENANT_ID}
    #     dce_url ${AZURE_DCE_URL}
    #     dcr_id ${AZURE_DCR_ID}
    #     table_name ${AZURE_TABLE_NAME}
    #     time_generated false
    #     time_key CreatedTime
    #     Compress gzip

# Environment variables from ConfigMap (for Azure secrets)
envFrom:
  - configMapRef:
      name: fluentbit-secrets
      optional: true

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Disable daemonset-specific features
daemonSetVolumes: []
daemonSetVolumeMounts: []

# Pod settings
podAnnotations: {}
podLabels: {}

tolerations: []
affinity: {}
nodeSelector: {}
