service:
  flush: 1
  log_level: info

pipeline:
  inputs:
    - name: tcp
      listen: 0.0.0.0
      port: 9000
      chunk_size: 32
      buffer_size: 64
      format: json

  filters:
    - name: modify
      match: '*'
      Rename:
        - time CreatedTime

  outputs:
    - name: azure_logs_ingestion
      match: '*'
      client_id: <client_id>
      client_secret: <client_secret> 
      tenant_id: <tenant_id> 
      dce_url: <dce_url> 
      dcr_id: <dcr_id> 
      table_name: <custom_table_name> 
      time_generated: false
      time_key: CreatedTime
      compress: true
